# Só configuração de ferramentas; o Luma não é publicado como pacote Python.
[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
# S603/S607: os apps chamam ferramentas fixas do Plasma (lista em core.py), nunca entrada do usuário
# S101: unittest usa assert dos próprios testes
ignore = ["S603", "S607", "S101"]

# Código herdado de LUMA-OS@44903f2, já validado lá; só estilo, sem reescrever o que funciona.
[tool.ruff.lint.per-file-ignores]
# Geradores de SVG: modelos de texto longos por natureza
"themes/tools/*.py" = ["E501", "E731"]
"wallpapers/**/*.py" = ["E501", "E702"]
"apps/settings/luma_ajustes/core.py" = ["E501"]
"tests/unit/test_theme.py" = ["E501"]
# id de sincronização do protocolo do qemu-guest-agent, não é uso criptográfico
"scripts/lab/qga.py" = ["S311"]
