# Gera a ISO pré-alpha do Luma e a anexa ao run por 7 dias (decisão 0011, autorizada pelo usuário em
# 2026-10-28). Repositório público: o artefato pode ser baixado por qualquer conta do GitHub.
# Nada vai para registro de containers.
name: iso
on:
  workflow_dispatch:
  push:
    paths:
      - Containerfile
      - build/**
      - configs/**
      - themes/**
      - plasma/**
      - icons/**
      - installer/**
      - wallpapers/**
      - apps/**
      - gaming/**
      - scripts/lab/**
      - scripts/ci/boot-iso.sh
      # O iso roda os testes da imagem antes de gerar a ISO: mudança neles também precisa de ISO nova
      - tests/image/**
      - tests/vm/**
      - scripts/ci/vm-test.sh
      - scripts/ci/assinatura-recusa.sh
      - scripts/ci/fontes.py
      - .github/workflows/iso.yml
permissions:
  contents: read
concurrency:
  group: iso-${{ github.ref }}
  # Não cancela o run em andamento: o usuário pode estar esperando aquela ISO. O push novo espera na fila
  # (só o mais recente fica pendente).
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # packages: write só para publicar no GHCR no fim, depois de todos os testes (decisão 0009)
    permissions:
      contents: read
      packages: write
    env:
      FEDORA_VERSION: "44"
      LUMA_VERSION: "0.9.0-dev"
      # Único branch que publica (o de desenvolvimento do Luma); push em outro branch só testa
      PUBLICAR_BRANCH: claude/eager-franklin-mb8qmf
      IMAGEM_GHCR: ghcr.io/selhorstkaliel/luma
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço e pôr o armazenamento do podman no disco com mais espaço
        # O caminho /var/lib/containers/storage precisa ser o mesmo no host e dentro do image-builder (o banco do
        # libpod grava o caminho; run iso #1 falhou com "database configuration mismatch"). Por isso bind mount,
        # nunca graphroot diferente.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h / /mnt
          root_free=$(df --output=avail -k / | tail -1); mnt_free=$(df --output=avail -k /mnt | tail -1)
          sudo mkdir -p /var/lib/containers/storage
          if [ "$mnt_free" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/containers /mnt/luma-out
            sudo mount --bind /mnt/containers /var/lib/containers/storage
            echo "OUT=/mnt/luma-out" >> "$GITHUB_ENV"
          else
            sudo mkdir -p /var/tmp/luma-out
            echo "OUT=/var/tmp/luma-out" >> "$GITHUB_ENV"
          fi
          findmnt /var/lib/containers/storage || echo "armazenamento do podman no disco raiz"
      - name: Base atual do quay.io (F6-08; o digest fica no log e nas labels da imagem)
        run: scripts/ci/atualizar-base.sh --gravar
      - name: Build da imagem Luma (root)
        run: sudo podman build --build-arg FEDORA_VERSION=$FEDORA_VERSION --build-arg LUMA_VERSION=$LUMA_VERSION -t localhost/luma:$FEDORA_VERSION .
      - name: Testes da imagem
        run: sudo podman run --rm -v "$PWD/tests/image:/t:ro" localhost/luma:$FEDORA_VERSION /t/test-image.sh
      - name: Build da imagem de instalador (Luma + Anaconda)
        run: sudo podman build -f build/iso/Containerfile.installer --build-arg LUMA_IMAGE=localhost/luma:$FEDORA_VERSION -t localhost/luma-installer:$FEDORA_VERSION .
      - name: Gerar ISO
        run: |
          sudo build/iso/build-iso.sh localhost/luma:$FEDORA_VERSION localhost/luma-installer:$FEDORA_VERSION "$OUT" "$LUMA_VERSION"
          df -h / /mnt
      - name: Smoke test de boot (QEMU + OVMF com Secure Boot)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf socat tesseract-ocr
          sudo scripts/ci/boot-iso.sh "$OUT/luma-$LUMA_VERSION-x86_64.iso" "$OUT/boot" 240
      - name: Preparar artefato
        if: always()
        run: |
          sudo cp build/iso/LEIA-ME-PRE-ALPHA.txt "$OUT/"
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          ls -la "$OUT" "$OUT/boot" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Commit no nome: artefatos de runs diferentes não se confundem no download
          name: luma-${{ env.LUMA_VERSION }}-${{ github.sha }}-iso-pre-alpha
          path: |
            ${{ env.OUT }}/*.iso
            ${{ env.OUT }}/*.sha256
            ${{ env.OUT }}/*.manifest
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/LEIA-ME-PRE-ALPHA.txt
            ${{ env.OUT }}/boot/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      # Daqui para baixo: teste do sistema INSTALADO (critérios que antes só a VM do usuário cobria). Roda depois
      # do upload para a ISO do usuário não depender dele. A ISO de teste (kickstart destrutivo do CI) fica fora
      # de qualquer artefato e é apagada logo após a instalação.
      - name: Liberar a ISO já enviada do disco
        # EV definido aqui: sem ele o upload das evidências virava "/" (run iso #17, scandir '/boot/efi')
        run: |
          sudo rm -f "$OUT"/*.iso
          echo "EV=$(dirname "$OUT")/luma-vm-evidencias" >> "$GITHUB_ENV"
      - name: Teste do sistema instalado (instalação sem interação, Secure Boot, sessão, nmap, Steam, Lume)
        run: |
          sudo apt-get install -y -q dnsmasq-base nmap
          sudo WORK_DIR="$(dirname "$OUT")/luma-vm-test" scripts/ci/vm-test.sh \
            localhost/luma:$FEDORA_VERSION localhost/luma-installer:$FEDORA_VERSION "$EV"
      - name: Preparar evidências do sistema instalado
        if: always() && env.EV != ''
        run: sudo chown -R "$(id -u):$(id -g)" "$EV" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && env.EV != ''
        with:
          name: luma-${{ env.LUMA_VERSION }}-${{ github.sha }}-evidencias-vm
          path: ${{ env.EV }}/
          retention-days: 7
          if-no-files-found: warn
      # Publicação (decisão 0009, autorizada pelo usuário em 2026-10-31): só a imagem que passou em TODOS os testes
      # acima, só no push do branch de desenvolvimento, e só assinada. Sem a chave do projeto no repositório ou sem
      # os segredos COSIGN_PRIVATE_KEY/COSIGN_PASSWORD, nada é publicado (aviso no run). Nunca sem assinatura.
      - name: Publicação - pré-requisitos (chave pública no repositório e segredos do cosign)
        id: pub
        if: success() && github.event_name == 'push' && github.ref_name == env.PUBLICAR_BRANCH
        env:
          TEM_SEGREDO: ${{ secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PASSWORD != '' }}
        run: |
          if [ "$TEM_SEGREDO" = true ] && [ -s configs/etc/pki/containers/luma-cosign.pub ]; then
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Imagem NÃO publicada: faltam os segredos COSIGN_PRIVATE_KEY/COSIGN_PASSWORD ou configs/etc/pki/containers/luma-cosign.pub (docs/decisions/0009-build-ci-assinatura.md)"
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          fi
      - uses: sigstore/cosign-installer@v3.7.0
        if: steps.pub.outputs.publicar == 'sim'
        with:
          cosign-release: v2.4.1
      - name: Publicar no GHCR e assinar com cosign (pelo digest)
        if: steps.pub.outputs.publicar == 'sim'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo podman image exists localhost/luma:$FEDORA_VERSION
          tag="$FEDORA_VERSION-${GITHUB_SHA::7}"
          # Antes de publicar: a senha abre a chave privada e ela corresponde à chave pública do repositório
          # Diagnóstico só com números (iso #43/#44: "invalid pem block"): nada do conteúdo do segredo vai para o log
          printf '%s' "$COSIGN_PRIVATE_KEY" >"$RUNNER_TEMP/k"
          echo "segredo: $(wc -c <"$RUNNER_TEMP/k") bytes, $(wc -l <"$RUNNER_TEMP/k") quebras de linha," \
            "BEGIN=$(grep -c -- '-----BEGIN' "$RUNNER_TEMP/k" || true) END=$(grep -c -- '-----END' "$RUNNER_TEMP/k" || true)" \
            "CR=$(tr -cd '\r' <"$RUNNER_TEMP/k" | wc -c) senha=$(printf '%s' "$COSIGN_PASSWORD" | wc -c) bytes"
          rm -f "$RUNNER_TEMP/k"
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$RUNNER_TEMP/segredo.pub" \
            || { echo "::error::COSIGN_PRIVATE_KEY/COSIGN_PASSWORD não abrem a chave; nada publicado. O segredo precisa do arquivo cosign.key inteiro, com as linhas BEGIN e END (gh secret set COSIGN_PRIVATE_KEY -R Selhorstkaliel/Luma < cosign.key)"; exit 1; }
          a="$(openssl pkey -pubin -in "$RUNNER_TEMP/segredo.pub" -outform DER | sha256sum | cut -c1-64)"
          b="$(openssl pkey -pubin -in configs/etc/pki/containers/luma-cosign.pub -outform DER | sha256sum | cut -c1-64)"
          [ "$a" = "$b" ] || { echo "::error::a chave do segredo ($a) não é a do repositório ($b); nada publicado"; exit 1; }
          echo "chave do segredo confere com configs/etc/pki/containers/luma-cosign.pub (sha256 DER $b)"
          echo "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman push --digestfile "$RUNNER_TEMP/digest" localhost/luma:$FEDORA_VERSION "docker://$IMAGEM_GHCR:$tag"
          sudo podman push localhost/luma:$FEDORA_VERSION "docker://$IMAGEM_GHCR:$FEDORA_VERSION"
          digest="$(sudo cat "$RUNNER_TEMP/digest")"
          echo "publicado: $IMAGEM_GHCR:$tag e :$FEDORA_VERSION ($digest)"
          cosign login ghcr.io -u "$GITHUB_ACTOR" -p "$TOKEN"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGEM_GHCR@$digest"
          cosign verify --key configs/etc/pki/containers/luma-cosign.pub "$IMAGEM_GHCR:$FEDORA_VERSION" >/dev/null
          echo "assinatura conferida com configs/etc/pki/containers/luma-cosign.pub"
          # [H] Pacote novo no GHCR nasce privado; o sistema instalado só baixa atualização se ele for público
          if curl -fsS "https://ghcr.io/token?scope=repository:${IMAGEM_GHCR#ghcr.io/}:pull" >/dev/null; then
            echo "pacote público: atualização anônima possível"
          else
            echo "::warning::O pacote $IMAGEM_GHCR não é público: GitHub > Packages > luma > Package settings > Change visibility > Public"
          fi
      # F6-07: imagem do canal sem assinatura ou com outra chave é recusada (registro local como mirror; nada sem
      # assinatura vai para o GHCR). Sem os segredos do cosign neste passo.
      - name: Recusa de imagem sem assinatura (F6-07)
        if: steps.pub.outputs.publicar == 'sim'
        run: sudo env "PATH=$PATH" scripts/ci/assinatura-recusa.sh localhost/luma:$FEDORA_VERSION
      # F6-10 (docs/FONTES.md): lista de pacotes, licenças e fontes (SRPM no koji do Fedora) da imagem publicada,
      # anexada como atestado assinado com a chave do projeto e guardada no run por 90 dias
      - name: Manifesto de fontes (F6-10)
        if: steps.pub.outputs.publicar == 'sim'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo podman run --rm -v "$PWD/scripts/ci:/s:ro" localhost/luma:$FEDORA_VERSION python3 /s/fontes.py > "$RUNNER_TEMP/fontes.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('fontes:', d['pacotes'], 'pacotes,', d['srpms'], 'SRPMs, sem SRPM:', [i['pacote'] for i in d['sem_srpm']])" "$RUNNER_TEMP/fontes.json"
          digest="$(sudo cat "$RUNNER_TEMP/digest")"
          tipo=https://github.com/Selhorstkaliel/Luma/fontes/v1
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type "$tipo" --predicate "$RUNNER_TEMP/fontes.json" "$IMAGEM_GHCR@$digest"
          cosign verify-attestation --key configs/etc/pki/containers/luma-cosign.pub --type "$tipo" "$IMAGEM_GHCR@$digest" >/dev/null
          echo "atestado de fontes anexado e conferido em $IMAGEM_GHCR@$digest"
          cp "$RUNNER_TEMP/fontes.json" "$RUNNER_TEMP/fontes-${GITHUB_SHA::7}.json"
      - uses: actions/upload-artifact@v4
        if: steps.pub.outputs.publicar == 'sim'
        with:
          name: luma-${{ env.LUMA_VERSION }}-${{ github.sha }}-fontes
          path: ${{ runner.temp }}/fontes-*.json
          retention-days: 90
