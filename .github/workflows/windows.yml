# Comparação de RAM e boot: Luma × Windows 11 (Enterprise Evaluation, gratuito por 90 dias, só para avaliação),
# na MESMA VM (6 GiB, 4 CPUs, Secure Boot, sem 3D), mesmo método (120 s parado após o login, total − disponível,
# mediana de 3 boots). Só informativa: não é critério de aprovação. Sob demanda ou quando o código do teste muda;
# leva cerca de 2 h. Nada é publicado: a ISO do Windows e os discos ficam só no runner; o artefato só tem números
# e capturas.
name: windows
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows.yml
      - scripts/ci/vm-windows.sh
      - tests/windows/**
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FEDORA_VERSION: "44"
      LUMA_VERSION: "0.9.0-dev"
      EV: /var/tmp/luma-windows-evidencias
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço (armazenamento do podman no mesmo caminho do host, como no iso.yml)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          root_free=$(df --output=avail -k / | tail -1); mnt_free=$(df --output=avail -k /mnt | tail -1)
          sudo mkdir -p /var/lib/containers/storage
          if [ "$mnt_free" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/containers && sudo mount --bind /mnt/containers /var/lib/containers/storage
            echo "WORK=/mnt/luma-windows" >> "$GITHUB_ENV"
          else
            echo "WORK=/var/tmp/luma-windows" >> "$GITHUB_ENV"
          fi
          df -h / /mnt
      - name: Ferramentas (QEMU, OVMF, TPM virtual, xorriso, OCR)
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf socat swtpm swtpm-tools xorriso tesseract-ocr
      - name: Imagem e instalador do Luma
        run: |
          scripts/ci/atualizar-base.sh --gravar   # base atual do quay.io, a mesma em todo o run (F6-08)
          sudo podman build --build-arg FEDORA_VERSION=$FEDORA_VERSION --build-arg LUMA_VERSION=$LUMA_VERSION -t localhost/luma:$FEDORA_VERSION .
          sudo podman build -f build/iso/Containerfile.installer --build-arg LUMA_IMAGE=localhost/luma:$FEDORA_VERSION -t localhost/luma-installer:$FEDORA_VERSION .
      - name: Medir o Luma (mesmo roteiro do workflow medicao)
        run: sudo WORK_DIR="$WORK" scripts/ci/vm-medicao.sh luma localhost/luma:$FEDORA_VERSION localhost/luma-installer:$FEDORA_VERSION "$EV"
      - name: Liberar as imagens do Luma (disco do runner)
        run: |
          sudo podman rmi -af || true
          sudo rm -rf "$WORK/luma"
          df -h / /mnt
      - name: Medir o Windows 11 (instalação sem interação na mesma VM)
        run: sudo WORK_DIR="$WORK/win" scripts/ci/vm-windows.sh "$EV"
      - name: Comparar (informativo)
        run: sudo MEDICAO_BASE="Windows 11" python3 scripts/ci/medicao-compara.py "$EV/medicao-windows.txt" "$EV/medicao-luma.txt" "$EV/comparacao-windows.txt"
      - name: Preparar evidências
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$EV" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ github.sha }}
          path: ${{ env.EV }}/
          retention-days: 7
          if-no-files-found: warn
