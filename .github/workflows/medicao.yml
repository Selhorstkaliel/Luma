# Medição de RAM e boot do sistema instalado (F5-03): Luma contra a Fedora Kinoite pura, mesma VM, mesmo
# kickstart do CI, mediana de 3 boots. Sob demanda (Actions > medicao > Run workflow) ou quando o código da
# medição muda: leva cerca de 1 h.
# Nada é publicado: as ISOs de teste são destrutivas e apagadas após instalar; o artefato só tem números.
name: medicao
on:
  workflow_dispatch:
  # Também quando o próprio código da medição muda (o disparo manual exige o workflow no branch padrão)
  push:
    paths:
      - .github/workflows/medicao.yml
      - scripts/ci/vm-medicao.sh
      - scripts/ci/medicao-compara.py
      - tests/vm/guest/luma-ci-medicao.sh
permissions:
  contents: read
concurrency:
  group: medicao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  medicao:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      FEDORA_VERSION: "44"
      LUMA_VERSION: "0.9.0-dev"
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço (armazenamento do podman no mesmo caminho do host, como no iso.yml)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          root_free=$(df --output=avail -k / | tail -1); mnt_free=$(df --output=avail -k /mnt | tail -1)
          sudo mkdir -p /var/lib/containers/storage
          if [ "$mnt_free" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/containers && sudo mount --bind /mnt/containers /var/lib/containers/storage
            echo "WORK=/mnt/luma-medicao" >> "$GITHUB_ENV"
          else
            echo "WORK=/var/tmp/luma-medicao" >> "$GITHUB_ENV"
          fi
          echo "EV=/var/tmp/luma-medicao-evidencias" >> "$GITHUB_ENV"
          df -h / /mnt
      - name: Ferramentas (QEMU, OVMF)
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf socat
      - name: Imagens e instaladores (Luma e Kinoite pura)
        run: |
          sudo podman build --build-arg FEDORA_VERSION=$FEDORA_VERSION --build-arg LUMA_VERSION=$LUMA_VERSION -t localhost/luma:$FEDORA_VERSION .
          sudo podman build -f build/iso/Containerfile.installer --build-arg LUMA_IMAGE=localhost/luma:$FEDORA_VERSION -t localhost/luma-installer:$FEDORA_VERSION .
          # A base sem nada do Luma: a mesma tag de que o Containerfile parte
          sudo podman pull quay.io/fedora/fedora-kinoite:$FEDORA_VERSION
          sudo podman tag quay.io/fedora/fedora-kinoite:$FEDORA_VERSION localhost/kinoite:$FEDORA_VERSION
          sudo podman build -f build/iso/Containerfile.installer --build-arg LUMA_IMAGE=localhost/kinoite:$FEDORA_VERSION -t localhost/kinoite-installer:$FEDORA_VERSION .
      - name: Medir a Kinoite pura
        run: sudo WORK_DIR="$WORK" scripts/ci/vm-medicao.sh kinoite localhost/kinoite:$FEDORA_VERSION localhost/kinoite-installer:$FEDORA_VERSION "$EV"
      - name: Medir o Luma
        run: sudo WORK_DIR="$WORK" scripts/ci/vm-medicao.sh luma localhost/luma:$FEDORA_VERSION localhost/luma-installer:$FEDORA_VERSION "$EV"
      - name: Comparar (F5-03)
        run: sudo python3 scripts/ci/medicao-compara.py "$EV/medicao-kinoite.txt" "$EV/medicao-luma.txt" "$EV/resultado-medicao.txt"
      - name: Preparar evidências
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$EV" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicao-${{ github.sha }}
          path: ${{ env.EV }}/
          retention-days: 7
          if-no-files-found: warn
