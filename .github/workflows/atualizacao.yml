# Rebuild periódico (F6-09, aprovado pelo usuário em 2026-11-03): toda segunda, e sob demanda, reconstrói o Luma pelo
# iso.yml, que resolve a base Fedora atual (F6-08), roda TODOS os testes e só publica com tudo verde; se algo falhar,
# nada é publicado e quem já instalou continua na versão anterior. Traz as atualizações dos pacotes do Fedora.
# Sem commit do bot: o quay.io apaga digests antigos em horas (ci #89 e #91), então o digest não fica no repositório;
# cada build resolve o atual e o grava nas labels da imagem.
name: atualizacao
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
  actions: write
concurrency:
  group: atualizacao
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Base atual (só informa)
        run: scripts/ci/atualizar-base.sh
      - name: Rebuild, testes e publicação (iso.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run iso.yml --ref "$GITHUB_REF_NAME"
