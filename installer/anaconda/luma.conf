# Perfil do Anaconda para o Luma-OS (F6-05): escolhido pelo ID do os-release do instalador e aplica a marca
# Luma por cima do perfil do Fedora. Não herda da Silverblue: ela esconde Rede, Senha e Usuário (o usuário nasce no
# GNOME Initial Setup), e o Luma ficaria sem usuário (instalador-ib #3). Só o particionamento atômico é copiado dela.
# Formato dos perfis em /etc/anaconda/profile.d/ (ex.: fedora-silverblue.conf).
[Profile]
profile_id = luma
base_profile = fedora

[Profile Detection]
os_id = luma

[Storage]
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/luma/luma.css
