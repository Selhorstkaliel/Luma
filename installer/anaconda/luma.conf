# Perfil do Anaconda para o Luma-OS (F6-05): escolhido pelo ID do os-release do instalador e aplica a marca
# Luma por cima do perfil do Fedora. Formato dos perfis em /etc/anaconda/profile.d/ (ex.: fedora-silverblue.conf).
[Profile]
profile_id = luma
base_profile = fedora

[Profile Detection]
os_id = luma

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/luma/luma.css
