# Luma: com a raiz em composefs (overlay), remontar "/" com as opções do btrfs que o Anaconda grava no
# /etc/fstab falha ("overlay: No changes allowed in reconfigure", run iso #19) e o serviço ficava com
# falha em todo boot. Com raiz overlay o serviço é pulado; /usr e /etc já são montados pelo ostree.
[Service]
ExecCondition=/usr/bin/sh -c 'test "$$(findmnt -no FSTYPE /)" != overlay'
