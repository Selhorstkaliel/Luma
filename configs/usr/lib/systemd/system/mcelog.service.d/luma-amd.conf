# Luma: o mcelog não funciona em processadores AMD recentes ("mcelog does not support this processor.
# Please use the edac_mce_amd module instead", run iso #19) e ficava com falha em todo boot nessas máquinas.
# Em AMD o serviço é pulado (condição, não falha); o kernel registra esses erros pelo edac_mce_amd.
[Service]
ExecCondition=/usr/bin/sh -c '! grep -q AuthenticAMD /proc/cpuinfo'
